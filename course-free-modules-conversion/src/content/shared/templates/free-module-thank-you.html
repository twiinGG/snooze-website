<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .thank-you-container {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            max-width: 600px;
            margin: 50px auto;
            padding: 40px 20px;
            color: #333;
        }

        .thank-you-container h1 {
            color: #1a1a1a;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .thank-you-container p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-library {
            display: inline-block;
            background-color: #F43357;
            /* Snooze Bedtime Brand Color */
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .btn-library:hover {
            background-color: #D92244;
        }
    </style>
</head>

<body>
    <div class="thank-you-container">
        <h1>You're All Set! 🎉</h1>

        <p>
            The <strong>Free Module</strong> has been unlocked and added to your library.
        </p>

        <p>
            We've just sent you an email with your access link and login details.
            Click the button below to jump straight in and start snoozing.
        </p>

        <a href="https://joinsnooze.com/login" class="btn-library">Go To My Library</a>

        <p style="margin-top: 40px; font-style: italic;">
            See you inside,<br>Sally x
        </p>
    </div>
</body>

</html>
