<script>
(function() {
  var USD_ACCESS_OFFER_URL = 'https://joinsnooze.com/offers/z63s9VaR/checkout';
  var AUD_ACCESS_OFFER_URL = 'https://joinsnooze.com/offers/vYgCNgJz/checkout';

  function readCurrencyPreference() {
    try {
      var pref = window.localStorage && window.localStorage.getItem('snooze_currency_preference');
      if (pref === 'AUD' || pref === 'USD') return pref;
    } catch (e) {
    }
    try {
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (tz && tz.indexOf('Australia') !== -1) return 'AUD';
    } catch (e) {
    }
    return 'USD';
  }

  window.getSnoozeCheckoutUrl = function() {
    return readCurrencyPreference() === 'AUD' ? AUD_ACCESS_OFFER_URL : USD_ACCESS_OFFER_URL;
  };

  Object.defineProperty(window, 'SNOOZE_CHECKOUT_URL', {
    configurable: true,
    get: function() { return window.getSnoozeCheckoutUrl(); }
  });
})();

window.SNOOZE_LIBRARY_URL = '/snooze-library';

window.SNOOZE_VILLAGE_URL = 'https://joinsnooze.com/products/communities/v2/snooze';

window.SNOOZE_LOGIN_URL = '/login';

window.SnoozeUserDetection = {
  detectUserStatus: function() {
    try {
      var loginLink = document.querySelector('a[href*="/login"]');

      var userAvatar = document.querySelector('img[alt*="User Avatar"], img[alt*="avatar"]');

      var myLibraryLink = document.querySelector('a[href*="/library"]');

      if (!loginLink && (userAvatar || myLibraryLink)) {
        if (myLibraryLink || window.location.pathname.includes('/library')) {
          return 'snooze-member';
        } else {
          return 'logged-in-non-member';
        }
      }

      return 'new-visitor';

    } catch (error) {
      console.warn('Snooze: User detection failed, defaulting to new-visitor', error);
      return 'new-visitor';
    }
  },

  getUserStatus: function() {
    var status = this.detectUserStatus();
    if (status === 'unknown') {
      return 'signposting';
    }
    return status;
  }
};
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const carousel = document.querySelector('.carousel-inner');
  const carouselContainer = document.querySelector('.carousel-track');

  if (carousel && carouselContainer) {
    const cards = Array.from(carousel.querySelectorAll('.card'));
    const isDesktop = window.innerWidth > 768;

    if (isDesktop && cards.length > 0) {
      const clone = carousel.innerHTML;
      carousel.insertAdjacentHTML('beforeend', clone);

      let scrollPosition = 0;
      const scrollSpeed = 0.3;
      let animationFrameId;
      let isPaused = false;
      let lastScrollTime = performance.now();

      const autoScroll = (currentTime) => {
        if (!isPaused) {
          const deltaTime = currentTime - lastScrollTime;
          lastScrollTime = currentTime;

          scrollPosition += scrollSpeed * (deltaTime / 16);
          carousel.scrollLeft = scrollPosition;

          const firstSetWidth = carousel.scrollWidth / 2;
          if (scrollPosition >= firstSetWidth) {
            scrollPosition = scrollPosition - firstSetWidth;
            carousel.scrollLeft = scrollPosition;
          }
        }

        animationFrameId = requestAnimationFrame(autoScroll);
      };

      lastScrollTime = performance.now();
      autoScroll(lastScrollTime);

      let pauseRequested = false;
      let pauseTimeout;

      carousel.addEventListener('mouseenter', () => {
        pauseRequested = true;
        pauseTimeout = setTimeout(() => {
          if (pauseRequested) {
            isPaused = true;
          }
        }, 50);
      });

      carousel.addEventListener('mouseleave', () => {
        pauseRequested = false;
        if (pauseTimeout) clearTimeout(pauseTimeout);
        isPaused = false;
        lastScrollTime = performance.now();
      });

      carousel.addEventListener('focusin', () => {
        isPaused = true;
      });

      carousel.addEventListener('focusout', () => {
        isPaused = false;
        lastScrollTime = performance.now();
      });

      window.addEventListener('beforeunload', () => {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
      });
    }

    if (!isDesktop && cards.length > 0) {
      const dotsContainer = document.querySelector('.carousel-dots');

      if (dotsContainer) {
        cards.forEach((_, index) => {
          const dot = document.createElement('span');
          dot.setAttribute('role', 'button');
          dot.setAttribute('aria-label', `Go to testimonial ${index + 1}`);
          dot.setAttribute('tabindex', '0');

          dotsContainer.appendChild(dot);
        });

        const dots = Array.from(dotsContainer.querySelectorAll('span'));
        let currentIndex = 0;
        let autoScrollInterval;

        let touchStartX = 0;
        let touchEndX = 0;
        let isSwipeActive = false;

        const updateDots = (index) => {
          dots.forEach((dot, i) => {
            const isActive = i === index;
            dot.classList.toggle('active', isActive);
            dot.setAttribute('aria-current', isActive ? 'true' : 'false');
          });
        };

        const scrollToCard = (index) => {
          if (index < 0 || index >= cards.length) return;

          currentIndex = index;
          const card = cards[index];

          if (card) {
            const containerPadding = parseInt(getComputedStyle(carousel).paddingLeft) || 0;
            const gap = parseInt(getComputedStyle(carousel).gap) || 24;
            const cardWidth = card.offsetWidth;

            const containerWidth = carousel.offsetWidth;
            const scrollLeft = card.offsetLeft - containerPadding - (containerWidth - cardWidth) / 2;

            carousel.scrollTo({
              left: Math.max(0, scrollLeft),
              behavior: 'smooth'
            });
          }

          updateDots(index);
        };

        const autoAdvance = () => {
          if (!isSwipeActive) {
            currentIndex = (currentIndex + 1) % cards.length;
            scrollToCard(currentIndex);
          }
        };

        const startAutoScroll = () => {
          stopAutoScroll();
          autoScrollInterval = setInterval(autoAdvance, 2000);
        };

        const stopAutoScroll = () => {
          if (autoScrollInterval) {
            clearInterval(autoScrollInterval);
            autoScrollInterval = null;
          }
        };

        carousel.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
          isSwipeActive = true;
          stopAutoScroll();
        }, { passive: true });

        carousel.addEventListener('touchmove', (e) => {
          isSwipeActive = true;
        }, { passive: true });

        carousel.addEventListener('touchend', (e) => {
          touchEndX = e.changedTouches[0].screenX;
          handleSwipe();

          setTimeout(() => {
            isSwipeActive = false;
            startAutoScroll();
          }, 3000);
        }, { passive: true });

        const handleSwipe = () => {
          const swipeThreshold = 50;
          const diff = touchStartX - touchEndX;

          if (Math.abs(diff) > swipeThreshold) {
            if (diff > 0) {
              currentIndex = (currentIndex + 1) % cards.length;
            } else {
              currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            }
            scrollToCard(currentIndex);
          }
        };

        dots.forEach((dot, index) => {
          dot.addEventListener('click', () => {
            stopAutoScroll();
            scrollToCard(index);
            setTimeout(() => startAutoScroll(), 2000);
          });

          dot.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              stopAutoScroll();
              scrollToCard(index);
              setTimeout(() => startAutoScroll(), 2000);
            }
          });
        });

        let scrollTimeout;
        carousel.addEventListener('scroll', () => {
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(() => {
            const scrollLeft = carousel.scrollLeft;
            const containerWidth = carousel.offsetWidth;
            const centerPosition = scrollLeft + containerWidth / 2;

            let closestIndex = 0;
            let closestDistance = Infinity;

            cards.forEach((card, index) => {
              const cardCenter = card.offsetLeft + card.offsetWidth / 2;
              const distance = Math.abs(centerPosition - cardCenter);

              if (distance < closestDistance) {
                closestDistance = distance;
                closestIndex = index;
              }
            });

            if (closestIndex !== currentIndex) {
              currentIndex = closestIndex;
              updateDots(closestIndex);
            }
          }, 100);
        }, { passive: true });

        updateDots(0);
        scrollToCard(0);
        startAutoScroll();

        carousel.addEventListener('focusin', () => {
          stopAutoScroll();
        });

        carousel.addEventListener('focusout', () => {
          setTimeout(() => startAutoScroll(), 2000);
        });
      }
    }
  }

  const faqItems = document.querySelectorAll('.faq-item');

  faqItems.forEach(item => {
    const checkbox = item.querySelector('input[type="checkbox"]');
    const answer = item.querySelector('.faq-answer');
    const question = item.querySelector('.faq-question');

    if (checkbox && answer && question) {
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          const contentHeight = answer.scrollHeight;
          answer.style.maxHeight = contentHeight + 'px';
        } else {
          answer.style.maxHeight = '0px';
        }
      });

      question.setAttribute('tabindex', '0');
      question.setAttribute('role', 'button');
      question.setAttribute('aria-expanded', 'false');

      question.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          checkbox.checked = !checkbox.checked;
          checkbox.dispatchEvent(new Event('change'));
          question.setAttribute('aria-expanded', checkbox.checked ? 'true' : 'false');
        }
      });

      question.addEventListener('click', () => {
        setTimeout(() => {
          question.setAttribute('aria-expanded', checkbox.checked ? 'true' : 'false');
        }, 0);
      });
    }
  });

  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
      const href = this.getAttribute('href');

      if (href === '#' || href === '#!') {
        e.preventDefault();
        return;
      }

      if (!href.startsWith('#')) {
        return;
      }

      try {
        const target = document.querySelector(href);
        if (target) {
          e.preventDefault();

          const navbar = document.querySelector('.navbar');
          const navbarHeight = navbar ? navbar.offsetHeight : 0;

          const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - navbarHeight - 20;

          window.scrollTo({
            top: targetPosition,
            behavior: 'smooth'
          });

          target.setAttribute('tabindex', '-1');
          target.focus();
        }
      } catch (error) {
        console.warn('Smooth scroll failed for href:', href, error);
      }
    });
  });

  const observerOptions = {
    threshold: 0.1,
    rootMargin: '0px 0px -50px 0px'
  };

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('fade-in-up');
        observer.unobserve(entry.target);
      }
    });
  }, observerOptions);

  document.querySelectorAll('.section').forEach(section => {
    observer.observe(section);
  });

  const pricingCards = document.querySelectorAll('.pricing-card');

  pricingCards.forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target === card || e.target.closest('.pricing-card') === card) {
        const button = card.querySelector('.cta-btn');
        if (button && !e.target.closest('.cta-btn')) {
          button.click();
        }
      }
    });
  });

  const lazyImages = document.querySelectorAll('img[data-src]');

  if (lazyImages.length > 0) {
    const imageObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
          imageObserver.unobserve(img);
        }
      });
    });

    lazyImages.forEach(img => imageObserver.observe(img));
  }

  const trackEvent = (category, action, label, properties) => {
    window.dataLayer = window.dataLayer || [];

    const payload = Object.assign({
      'event': action,
      'event_category': category,
      'event_label': label,
      'page_path': window.location.pathname,
      'page_title': document.title
    }, properties || {});

    window.dataLayer.push(payload);
  };

  const attributionKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid', 'gclid'];

  const captureAttribution = () => {
    try {
      const params = new URLSearchParams(window.location.search);
      const touch = {};
      attributionKeys.forEach(key => {
        if (params.has(key)) touch[key] = params.get(key);
      });
      if (Object.keys(touch).length === 0) return;
      const firstTouchKey = 'snooze_attribution_first_touch';
      const currentTouchKey = 'snooze_attribution_current_touch';
      if (!window.localStorage.getItem(firstTouchKey)) {
        window.localStorage.setItem(firstTouchKey, JSON.stringify(touch));
      }
      window.localStorage.setItem(currentTouchKey, JSON.stringify(touch));
    } catch (error) {
      console.warn('Snooze Tracking: Attribution storage unavailable', error);
    }
  };

  const activeCurrency = () => {
    try {
      const preference = window.localStorage.getItem('snooze_currency_preference');
      if (preference === 'AUD' || preference === 'USD') return preference;
    } catch (error) {}
    if (document.body.classList.contains('currency-mode-aud')) return 'AUD';
    const activeToggle = document.querySelector('[data-currency].is-active');
    if (activeToggle) {
      const rendered = activeToggle.getAttribute('data-currency');
      if (rendered === 'AUD' || rendered === 'USD') return rendered;
    }
    return 'USD';
  };

  const normaliseSurface = value => String(value || '').replace(/-/g, '_');

  const eventSurface = link => {
    const explicit = link.closest('[data-surface]');
    if (explicit && explicit.getAttribute('data-surface')) return normaliseSurface(explicit.getAttribute('data-surface'));
    const wrapper = link.closest('[id$="-page"]');
    if (wrapper) return normaliseSurface(wrapper.id.replace(/-page$/, ''));
    return window.location.pathname === '/' ? 'homepage' : normaliseSurface(window.location.pathname.replace(/^\/+|\/+$/g, '')) || 'unknown';
  };

  const eventPlacement = link => {
    if (link.getAttribute('data-placement')) return link.getAttribute('data-placement');
    const explicit = link.closest('[data-placement]');
    if (explicit) return explicit.getAttribute('data-placement');
    const section = link.closest('section[id], header, footer, nav');
    if (!section) return 'body';
    return section.id || section.tagName.toLowerCase();
  };

  const destinationPath = href => {
    try {
      const url = new URL(href, window.location.origin);
      return url.pathname;
    } catch (error) {
      return href.split('?')[0];
    }
  };

  const isCheckoutLink = (href) => {
    if (!href) return false;

    try {
      const normalizedHref = href.startsWith('http') ? href : new URL(href, window.location.origin).href;
      const url = new URL(normalizedHref);

      const offerPattern = /\/offers\/[a-zA-Z0-9]{6,12}(\/checkout)?(\?|$)/;

      if (offerPattern.test(url.pathname)) {
        return true;
      }

      const checkoutUrl = (window && window.SNOOZE_CHECKOUT_URL);
      if (checkoutUrl) {
        const normalizedCheckout = checkoutUrl.startsWith('http') ? checkoutUrl : new URL(checkoutUrl, window.location.origin).href;
        if (normalizedHref === normalizedCheckout || normalizedHref.startsWith(normalizedCheckout.split('?')[0])) {
          return true;
        }
      }

      if (normalizedHref.includes('/offers/') && normalizedHref.includes('checkout')) {
        return true;
      }

      return false;
    } catch (e) {
      return href.includes('/offers/') && (href.includes('/checkout') || href.match(/\/offers\/[a-zA-Z0-9]{6,12}(\?|$)/));
    }
  };

  const isMembershipCta = href => {
    if (!href) return false;
    return [
      '/snooze-membership',
      'mqQikDM7', 'Sr6KzShx', '2150887297', '2151254578',
      'z63s9VaR', 'vYgCNgJz', '2150754998', '2151256977'
    ].some(identifier => href.indexOf(identifier) > -1);
  };

  const isCampCta = href => href && href.indexOf('/camp-snooze-sleep-coaching') > -1;
  const isTrackedCta = link => link && link.dataset && link.dataset.snoozeEvent;

  captureAttribution();

  const membershipPage = document.getElementById('snooze-membership-page');
  if (membershipPage && !window.__snoozeMembershipViewItemFired) {
    window.__snoozeMembershipViewItemFired = true;
    trackEvent('ecommerce', 'view_item', 'Snooze Membership', {
      item_id: 'snooze_membership',
      item_name: 'Snooze Membership',
      currency: activeCurrency(),
      surface: 'snooze_membership'
    });
  }

  document.addEventListener('click', function(e) {
    const link = e.target.closest('a');
    if (!link) return;

    const href = link.href || link.getAttribute('href') || '';
    const buttonText = link.textContent.trim() || link.innerText.trim() || 'Checkout Link';
    const isCheckout = isCheckoutLink(href);
    const isPrimaryCta = link.classList.contains('btn-primary') ||
        link.classList.contains('cta-btn') ||
        link.classList.contains('primary') ||
        link.closest('.btn-primary') ||
        link.closest('.cta-btn');

    if (isTrackedCta(link) || isCampCta(href)) {
      const eventName = isTrackedCta(link) ? link.dataset.snoozeEvent : 'camp_cta_click';
      trackEvent('conversion', eventName, buttonText, {
        surface: eventSurface(link),
        placement: eventPlacement(link),
        button_text: buttonText,
        destination: destinationPath(href),
        currency: activeCurrency()
      });
    } else if (isMembershipCta(href)) {
      trackEvent('conversion', 'membership_cta_click', buttonText, {
        surface: eventSurface(link),
        placement: eventPlacement(link),
        button_text: buttonText,
        destination: destinationPath(href),
        currency: activeCurrency()
      });
    } else if (isCheckout) {
      trackEvent('conversion', 'checkout_cta_click', buttonText, {
        surface: eventSurface(link),
        placement: eventPlacement(link),
        button_text: buttonText,
        destination: destinationPath(href),
        currency: activeCurrency()
      });
    } else if (isPrimaryCta) {
      trackEvent('engagement', 'cta_click', buttonText, {
        surface: eventSurface(link),
        placement: eventPlacement(link),
        button_text: buttonText,
        destination: destinationPath(href),
        currency: activeCurrency()
      });
    }
  }, true);

  faqItems.forEach((item, index) => {
    const checkbox = item.querySelector('input[type="checkbox"]');
    const question = item.querySelector('.faq-question');

    if (checkbox && question) {
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          const questionText = question.textContent.trim();
          trackEvent('engagement', 'faq_opened', questionText, index + 1);
        }
      });
    }
  });

function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

function isInViewport(element) {
  const rect = element.getBoundingClientRect();
  return (
    rect.top >= 0 &&
    rect.left >= 0 &&
    rect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
    rect.right <= (window.innerWidth || document.documentElement.clientWidth)
  );
}

function throttle(func, limit) {
  let inThrottle;
  return function(...args) {
    if (!inThrottle) {
      func.apply(this, args);
      inThrottle = true;
      setTimeout(() => { inThrottle = false; }, limit);
    }
  };
}

(function() {
  'use strict';

  function positionDropdown(dropdown, menu) {
    if (!dropdown || !menu) return;

    var toggle = dropdown.querySelector('.sn-dropdown-toggle, .nav-dropdown-toggle');
    if (!toggle) return;

    var toggleRect = toggle.getBoundingClientRect();
    var menuRect = menu.getBoundingClientRect();

    var left = toggleRect.left + (toggleRect.width / 2) - (menuRect.width / 2);
    var top = toggleRect.bottom + 8;

    if (left < 8) left = 8;
    if (left + menuRect.width > window.innerWidth - 8) {
      left = window.innerWidth - menuRect.width - 8;
    }

    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  }

  function initDropdowns() {
    var desktopDropdowns = document.querySelectorAll('.sn-dropdown, .nav-dropdown');

    desktopDropdowns.forEach(function(dropdown) {
      var toggle = dropdown.querySelector('.sn-dropdown-toggle, .nav-dropdown-toggle');
      var menu = dropdown.querySelector('.sn-dropdown-menu, .nav-dropdown-menu');

      if (toggle && menu) {
        var closeTimer = null;
        var isHovering = false;

        var showDropdown = function() {
          if (closeTimer) {
            clearTimeout(closeTimer);
            closeTimer = null;
          }
          positionDropdown(dropdown, menu);
          dropdown.classList.add('hover-active');
        };

        var hideDropdown = function() {
          if (closeTimer) {
            clearTimeout(closeTimer);
          }
          closeTimer = setTimeout(function() {
            if (!dropdown.classList.contains('active') && !isHovering) {
              dropdown.classList.remove('hover-active');
              menu.style.left = '';
              menu.style.top = '';
            }
          }, 150);
        };

        dropdown.addEventListener('mouseenter', function() {
          isHovering = true;
          showDropdown();
        });

        dropdown.addEventListener('mouseleave', function(e) {
          isHovering = false;
          var relatedTarget = e.relatedTarget;
          if (relatedTarget && (menu.contains(relatedTarget) || menu === relatedTarget)) {
            return;
          }
          hideDropdown();
        });

        menu.addEventListener('mouseenter', function() {
          isHovering = true;
          showDropdown();
        });

        menu.addEventListener('mouseleave', function() {
          isHovering = false;
          hideDropdown();
        });

        toggle.addEventListener('click', function(e) {
          if (window.innerWidth < 992 || dropdown.classList.contains('active')) {
            e.preventDefault();
          }

          var isActive = dropdown.classList.contains('active');

          desktopDropdowns.forEach(function(other) {
            if (other !== dropdown) {
              other.classList.remove('active');
              other.classList.remove('hover-active');
              var otherMenu = other.querySelector('.sn-dropdown-menu, .nav-dropdown-menu');
              if (otherMenu) {
                otherMenu.style.left = '';
                otherMenu.style.top = '';
              }
            }
          });

          if (isActive) {
            dropdown.classList.remove('active');
            dropdown.classList.remove('hover-active');
            menu.style.left = '';
            menu.style.top = '';
          } else {
            dropdown.classList.add('active');
            dropdown.classList.add('hover-active');
            positionDropdown(dropdown, menu);
          }
        });

        window.addEventListener('scroll', function() {
          if (dropdown.classList.contains('active') || dropdown.classList.contains('hover-active')) {
            positionDropdown(dropdown, menu);
          }
        }, true);

        window.addEventListener('resize', function() {
          if (dropdown.classList.contains('active') || dropdown.classList.contains('hover-active')) {
            positionDropdown(dropdown, menu);
          }
        });
      }
    });

    var mobileDropdowns = document.querySelectorAll('.sn-mobile-dropdown');

    mobileDropdowns.forEach(function(dropdown) {
      var toggle = dropdown.querySelector('.sn-mobile-dropdown-toggle');

      if (toggle) {
        toggle.addEventListener('click', function(e) {
          e.preventDefault();

          var isActive = dropdown.classList.contains('active');

          mobileDropdowns.forEach(function(other) {
            if (other !== dropdown) {
              other.classList.remove('active');
            }
          });

          if (isActive) {
            dropdown.classList.remove('active');
          } else {
            dropdown.classList.add('active');
          }
        });
      }
    });

    document.addEventListener('click', function(e) {
      var clickedInside = false;

      desktopDropdowns.forEach(function(dropdown) {
        if (dropdown.contains(e.target)) {
          clickedInside = true;
        }
      });

      mobileDropdowns.forEach(function(dropdown) {
        if (dropdown.contains(e.target)) {
          clickedInside = true;
        }
      });

      if (!clickedInside) {
        desktopDropdowns.forEach(function(dropdown) {
          dropdown.classList.remove('active');
          dropdown.classList.remove('hover-active');
          var menu = dropdown.querySelector('.sn-dropdown-menu, .nav-dropdown-menu');
          if (menu) {
            menu.style.left = '';
            menu.style.top = '';
          }
        });
        mobileDropdowns.forEach(function(dropdown) {
          dropdown.classList.remove('active');
        });
      }
    });

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        if (window.innerWidth >= 992) {
          desktopDropdowns.forEach(function(dropdown) {
            dropdown.classList.remove('active');
            dropdown.classList.remove('hover-active');
            var menu = dropdown.querySelector('.sn-dropdown-menu, .nav-dropdown-menu');
            if (menu) {
              menu.style.left = '';
              menu.style.top = '';
            }
          });
        }
      }, 250);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDropdowns);
  } else {
    initDropdowns();
  }
})();

(function() {

  window.closeLaunchBanner = function() {

      document.body.classList.remove('sn-banner-visible');

      var customNav = document.getElementById('snooze-nav-clean') || document.querySelector('nav.snooze-nav-clean');

      }

      var expiry = new Date().getTime() + (24 * 60 * 60 * 1000);
      localStorage.setItem('sn-launch-banner-closed', expiry.toString());
    }
  };

  function initLaunchBanner() {
    var banner = document.getElementById('sn-launch-banner');
    if (!banner) return;

    banner.style.top = '0px';

    var closedUntil = localStorage.getItem('sn-launch-banner-closed');
    var isHidden = false;

    if (closedUntil) {
      var now = new Date().getTime();
      if (now < parseInt(closedUntil)) {
        banner.classList.add('hidden');
        document.body.classList.remove('sn-banner-visible');
        isHidden = true;
      } else {
        localStorage.removeItem('sn-launch-banner-closed');
      }
    }

    if (!isHidden && !banner.classList.contains('hidden')) {
      document.body.classList.add('sn-banner-visible');

      var bannerHeight = banner.offsetHeight || 50;

      var customNav = document.getElementById('snooze-nav-clean') || document.querySelector('nav.snooze-nav-clean');
      if (customNav) {
        customNav.style.top = bannerHeight + 'px';
      }
    } else {
      var customNav = document.getElementById('snooze-nav-clean') || document.querySelector('nav.snooze-nav-clean');
      if (customNav) {
        customNav.style.top = '0px';
      }
    }
  }

  window.addEventListener('resize', function() {
    var banner = document.getElementById('sn-launch-banner');
    if (banner && !banner.classList.contains('hidden')) {
      var bannerHeight = banner.offsetHeight || 50;
      var customNav = document.getElementById('snooze-nav-clean') || document.querySelector('nav.snooze-nav-clean');
      if (customNav) {
        customNav.style.top = bannerHeight + 'px';
      }
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLaunchBanner);
  } else {
    initLaunchBanner();
  }
})();

</script>

      : (document.body.classList.contains('currency-mode-usd') ? 'USD' : null);

    document.body.classList.remove('currency-mode-usd', 'currency-mode-aud');
    document.body.classList.add('currency-mode-' + currency.toLowerCase());

    if (save) {
      const storage = safeLocalStorage();
      if (storage) {
        try {
          storage.setItem(CONFIG.storageKey, currency);
        } catch (e) {
          logError('Failed to save currency preference', e);
        }
      } else {
        logWarning('localStorage unavailable, preference not saved');
      }
    }

    updatePrices(currency);
    updateLinks(currency);
    updateToggleUI(currency);

    document.body.classList.add('currency-loaded');

    if (save && previousCurrency && previousCurrency !== currency) {
      try {
        const pageWrapper = document.querySelector('[id$="-page"]');
        const pathname = window.location && typeof window.location.pathname === 'string'
          ? window.location.pathname
          : '';
        window.dataLayer = window.dataLayer || [];
        const surfaceValue = pageWrapper
          ? pageWrapper.id.replace(/-page$/, '')
          : (pathname === '/' ? 'homepage' : pathname.replace(/^\/+|\/+$/g, '') || 'unknown');
        window.dataLayer.push({
          'event': 'currency_change',
          'previous_currency': previousCurrency,
          'currency': currency,
          'surface': String(surfaceValue).replace(/-/g, '_')
        });
      } catch (e) {
        logError('Failed to push currency_change event', e);
      }
    }
  };

  function updatePrices(currency) {
    const elements = document.querySelectorAll('.dynamic-price');
    let updatedCount = 0;
    let missingCount = 0;

    elements.forEach(el => {
      const price = el.getAttribute(`data-${currency.toLowerCase()}`);
      const period = el.getAttribute(`data-period-${currency.toLowerCase()}`) || '';

      if (!price) {
        missingCount++;
        logWarning('Missing data-' + currency.toLowerCase() + ' attribute on element', el);
        return;
      }

      try {
        const symbolOverride = el.getAttribute(`data-symbol-${currency.toLowerCase()}`);
        const symbol = symbolOverride !== null ? symbolOverride : (currency === 'AUD' ? 'A$' : '$');

        if (el.classList.contains('price')) {
          el.innerHTML = `<span class="dollar-sign">${symbol}</span>${price}<span> ${currency}</span><span>${period}</span>`;
        } else {
          el.textContent = `${symbol}${price}${period}`;
        }

        const numericValue = parseFloat(price.toString().replace(/[^0-9.]/g, ''));
        if (!isNaN(numericValue)) {
          el.setAttribute('data-price-value', numericValue);
        }

        updatedCount++;
      } catch (e) {
        logError('Failed to update price element', e);
      }
    });

    if (missingCount > 0) {
      logWarning(missingCount + ' price elements missing required data attributes');
    }
  }

  function rewriteCheckoutUrl(originalHref, currency) {
    if (!originalHref) return originalHref;

    let newLink = originalHref;
    let changed = false;

    for (const [usdId, audId] of Object.entries(CONFIG.offerMapping)) {
      if (currency === 'AUD' && newLink.includes(usdId)) {
        newLink = newLink.replace(usdId, audId);
        changed = true;
        break;
      } else if (currency === 'USD' && newLink.includes(audId)) {
        newLink = newLink.replace(audId, usdId);
        changed = true;
        break;
      }
    }

    const variantMatch = newLink.match(/([?&]variant=)([^&#]+)/);
    if (variantMatch) {
      const currentVariant = variantMatch[2];
      let targetVariant = null;
      for (const [usdVar, audVar] of Object.entries(CONFIG.variantMapping)) {
        if (currency === 'AUD' && currentVariant === usdVar) {
          targetVariant = audVar;
          break;
        } else if (currency === 'USD' && currentVariant === audVar) {
          targetVariant = usdVar;
          break;
        }
      }
      if (targetVariant && targetVariant !== currentVariant) {
        newLink = newLink.replace(
          /([?&]variant=)([^&#]+)/,
          '$1' + targetVariant
        );
        changed = true;
      }
    }

    return changed ? newLink : originalHref;
  }

  function preserveInboundAttribution(destinationHref, inboundHref) {
    if (!destinationHref) return destinationHref;

    try {
      const destination = new URL(destinationHref, window.location.href);
      const inbound = new URL(inboundHref || window.location.href, window.location.href);

      Array.from(destination.searchParams.keys()).forEach(function(key) {
        const preserve = key.indexOf('utm_') === 0 ||
          key === 'fbclid' || key === 'gclid' ||
          key === 'cohort' || key.indexOf('cohort_') === 0;
        if (preserve) {
          destination.searchParams.set(key, destination.searchParams.get(key));
        }
      });

      inbound.searchParams.forEach(function(value, key) {
        const preserve = key.indexOf('utm_') === 0 ||
          key === 'fbclid' || key === 'gclid' ||
          key === 'cohort' || key.indexOf('cohort_') === 0;

        if (preserve && !destination.searchParams.has(key)) {
          destination.searchParams.set(key, value);
        }
      });

      return destination.toString();
    } catch (e) {
      logWarning('Failed to preserve inbound attribution on checkout link');
      return destinationHref;
    }
  }

  function updateLinks(currency) {
    const buttons = document.querySelectorAll('.dynamic-cta, [data-checkout], .pricing-card a, .hero-cta');
    let updatedCount = 0;
    let errorCount = 0;

    buttons.forEach(btn => {
      try {
        let originalHref = btn.getAttribute('data-original-href');
        if (!originalHref) {
          originalHref = btn.getAttribute('href');
          if (originalHref) {
            btn.setAttribute('data-original-href', originalHref);
          }
        }

        if (!originalHref) {
          return;
        }

        const rewrittenLink = rewriteCheckoutUrl(originalHref, currency);
        const newLink = preserveInboundAttribution(rewrittenLink, window.location.href);
        const linkChanged = newLink !== btn.getAttribute('href');

        if (linkChanged) {
          try {
            if (newLink.indexOf('http') === 0 || newLink.indexOf('/') === 0) {
              btn.setAttribute('href', newLink);
              updatedCount++;
            } else {
              logWarning('Invalid URL generated: ' + newLink);
              errorCount++;
            }
          } catch (e) {
            logError('Failed to update link', e);
            errorCount++;
          }
        }
      } catch (e) {
        logError('Error processing button', e);
        errorCount++;
      }
    });

    if (errorCount > 0) {
      logWarning(errorCount + ' links failed to update');
    }
  }

  function injectToggles() {
    const navSelectors = [
      '.navbar .sn-actions',
      '.navbar nav',
      '.sn-nav-actions',
      '[class*="nav-actions"]'
    ];

    let navActions = null;
    for (let i = 0; i < navSelectors.length; i++) {
      navActions = document.querySelector(navSelectors[i]);
      if (navActions) break;
    }

    if (navActions && !document.querySelector('.nav-currency-toggle')) {
      try {
        const toggle = createToggleButton('nav-currency-toggle');
        navActions.appendChild(toggle);
      } catch (e) {
        logError('Failed to inject desktop toggle', e);
      }
    }

    const mobileSelectors = [
      '.sn-mobile-inner',
      '.mobile-menu',
      '[class*="mobile-menu"]'
    ];

    let mobileMenu = null;
    for (let i = 0; i < mobileSelectors.length; i++) {
      mobileMenu = document.querySelector(mobileSelectors[i]);
      if (mobileMenu) break;
    }

    if (mobileMenu && !document.querySelector('.mobile-currency-toggle')) {
      try {
        const toggle = createToggleButton('mobile-currency-toggle');
        toggle.style.marginTop = '20px';
        toggle.style.width = '100%';
        toggle.style.justifyContent = 'center';
        mobileMenu.appendChild(toggle);
      } catch (e) {
        logError('Failed to inject mobile toggle', e);
      }
    }

    const inlineMounts = document.querySelectorAll('.sn-currency-inline');
    inlineMounts.forEach(mount => {
      if (mount.querySelector('.currency-toggle-btn')) return;
      try {
        mount.appendChild(createToggleButton('inline-currency-toggle'));
      } catch (e) {
        logError('Failed to inject inline toggle', e);
      }
    });

    const stickyMounts = document.querySelectorAll('.sn-currency-sticky');
    stickyMounts.forEach(mount => {
      if (mount.querySelector('.currency-toggle-btn')) return;
      try {
        mount.appendChild(createToggleButton('sticky-currency-toggle'));
      } catch (e) {
        logError('Failed to inject sticky toggle', e);
      }
    });

    try {
      const current = document.body.classList.contains('currency-mode-aud') ? 'AUD' : 'USD';
      updateToggleUI(current);
    } catch (e) {
      logError('Failed to label injected toggles', e);
    }
  }

  function handleRadiogroupKeydown(e, group) {
    const segments = group.querySelectorAll('button[role="radio"]');
    if (segments.length !== 2) return;

    const currentIndex = Array.prototype.findIndex.call(segments, function(seg) {
      return seg.getAttribute('aria-checked') === 'true';
    });
    const focusedIndex = Array.prototype.indexOf.call(segments, document.activeElement);

    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      const nextIndex = e.key === 'ArrowRight'
        ? (currentIndex + 1) % 2
        : (currentIndex - 1 + 2) % 2;
      const nextCurrency = segments[nextIndex].getAttribute('data-currency');
      setCurrency(nextCurrency, true);
      segments[nextIndex].focus();
    } else if (e.key === 'Enter' || e.key === ' ') {
      if (focusedIndex === -1) return;
      e.preventDefault();
      const focusedCurrency = segments[focusedIndex].getAttribute('data-currency');
      setCurrency(focusedCurrency, true);
    }
  }

  function createToggleButton(className) {
    const group = document.createElement('div');
    group.className = 'currency-toggle-btn ' + className;
    group.setAttribute('role', 'radiogroup');
    group.setAttribute('aria-label', 'Price currency');

    ['USD', 'AUD'].forEach(function(currency) {
      const segment = document.createElement('button');
      segment.type = 'button';
      segment.setAttribute('role', 'radio');
      segment.setAttribute('aria-checked', 'false');
      segment.setAttribute('tabindex', '-1');
      segment.setAttribute('data-currency', currency);
      segment.textContent = currency;

      segment.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        try {
          setCurrency(currency, true);
        } catch (err) {
          logError('Toggle click failed', err);
        }
      });

      group.appendChild(segment);
    });

    group.addEventListener('keydown', function(e) {
      handleRadiogroupKeydown(e, group);
    });

    return group;
  }

  function updateToggleUI(currency) {
    const toggles = document.querySelectorAll('.currency-toggle-btn');

    toggles.forEach(function(t) {
      try {
        const segments = t.querySelectorAll('button[role="radio"]');
        segments.forEach(function(seg) {
          const segCurrency = seg.getAttribute('data-currency');
          const isActive = segCurrency === currency;
          seg.setAttribute('aria-checked', isActive ? 'true' : 'false');
          seg.setAttribute('tabindex', isActive ? '0' : '-1');
          if (isActive) {
            seg.classList.add('is-active');
          } else {
            seg.classList.remove('is-active');
          }
        });
      } catch (e) {
        logError('Failed to update toggle UI', e);
      }
    });
  }

  function handleCheckoutPage() {
    if (!window.location.href.includes('/checkout')) return;

    const currentUrl = window.location.href;
    let currentOfferId = null;
    let targetOfferId = null;
    let targetCurrency = 'USD';

    for (const [usdId, audId] of Object.entries(CONFIG.offerMapping)) {
      if (currentUrl.includes(usdId)) {
        currentOfferId = usdId;
        targetOfferId = audId;
        targetCurrency = 'AUD';
        break;
      } else if (currentUrl.includes(audId)) {
        currentOfferId = audId;
        targetOfferId = usdId;
        targetCurrency = 'USD';
        break;
      }
    }

    if (targetOfferId) {
      try {
        const containerSelectors = [
          '.checkout-panel-header',
          '.panel-heading',
          '.checkout-header',
          '[class*="checkout-header"]'
        ];

        let container = null;
        for (let i = 0; i < containerSelectors.length; i++) {
          container = document.querySelector(containerSelectors[i]);
          if (container) break;
        }

        if (!container) {
          container = document.body;
        }

        const switchDiv = document.createElement('div');
        switchDiv.className = 'checkout-currency-switch';
        switchDiv.innerHTML = `Prefer to pay in ${targetCurrency}? <a href="#" id="currency-switch-link">Switch to ${targetCurrency}</a>`;

        if (container.nextSibling) {
          container.parentNode.insertBefore(switchDiv, container.nextSibling);
        } else {
          container.appendChild(switchDiv);
        }

        const switchLink = document.getElementById('currency-switch-link');
        if (switchLink) {
          switchLink.addEventListener('click', function(e) {
            e.preventDefault();
            try {
              const storage = safeLocalStorage();
              if (storage) {
                storage.setItem(CONFIG.storageKey, targetCurrency);
              }
              window.location.href = currentUrl.replace(currentOfferId, targetOfferId);
            } catch (err) {
              logError('Failed to switch currency on checkout', err);
            }
          });
        }

        if (targetCurrency === 'USD') {
          const couponSelectors = [
            '.checkout-coupon-panel',
            '#coupon-panel',
            '[class*="coupon"]',
            '[id*="coupon"]'
          ];

          let couponArea = null;
          for (let i = 0; i < couponSelectors.length; i++) {
            couponArea = document.querySelector(couponSelectors[i]);
            if (couponArea) break;
          }

          if (couponArea) {
            const warning = document.createElement('div');
            warning.className = 'aud-discount-warning';
            warning.innerText = 'Note: Most discount codes are valid for USD pricing only.';
            couponArea.parentNode.insertBefore(warning, couponArea);
          }
        }
      } catch (e) {
        logError('Failed to handle checkout page', e);
      }
    }
  }

  if (typeof window !== 'undefined') {
    window.__snoozeCurrencyToggle__ = {
      rewriteCheckoutUrl: rewriteCheckoutUrl,
      preserveInboundAttribution: preserveInboundAttribution,
      CONFIG: CONFIG,
      createToggleButton: createToggleButton,
      updateToggleUI: updateToggleUI
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCurrency);
  } else {
    initCurrency();
  }

})();
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  const path = location.pathname.replace(/\/+$/, '');
  if (path.indexOf('/blog/') !== 0 || path === '/blog') return;
  if (document.querySelector('script[data-snooze-schema="blogposting"]')) return;

  const metaContent = (sel) => {
    const el = document.querySelector(sel);
    return el ? (el.getAttribute('content') || '').trim() : '';
  };
  const text = (sel) => {
    const el = document.querySelector(sel);
    return el ? (el.textContent || '').trim() : '';
  };
  const isoDate = (s) => {
    if (!s) return '';
    const d = new Date(s);
    if (Number.isNaN(d.getTime())) return '';
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${mm}-${dd}`;
  };

  const canonical = document.querySelector('link[rel="canonical"]');
  const url = canonical ? canonical.href : location.href;
  const title = text('.blog-post-body__title') || metaContent('meta[property="og:title"]') || document.title;
  const image = metaContent('meta[property="og:image"]');
  const description = metaContent('meta[name="description"]') || metaContent('meta[property="og:description"]');
  const published = isoDate(text('.blog-post-body__date'));

  const data = {
    '@context': 'https://schema.org',
    '@type': 'BlogPosting',
    mainEntityOfPage: { '@type': 'WebPage', '@id': url },
    headline: title,
    url,
    author: {
      '@type': 'Person',
      '@id': 'https://www.joinsnooze.com/about-sally#person',
      name: 'Sally Woods',
      url: 'https://www.joinsnooze.com/about-sally'
    },
    publisher: { '@id': 'https://www.joinsnooze.com/#organization' }
  };
  if (description) data.description = description;
  if (image) data.image = image;
  if (published) {
    data.datePublished = published;
    data.dateModified = published;
  }

  const s = document.createElement('script');
  s.type = 'application/ld+json';
  s.setAttribute('data-snooze-schema', 'blogposting');
  s.textContent = JSON.stringify(data);
  document.head.appendChild(s);
});
</script>

<script>
/* Snooze homepage membership-pricing currency enhancement.
   The homepage pricing lives in a single Encore custom-code block whose
   Ace editor will not persist programmatic edits, so this enhancement tags
   the price elements at runtime and lets the site-wide currency engine drive
   them. Homepage-scoped (guards on #pricing .price-grid); idempotent. */
(function () {
  'use strict';
  function enhance() {
    var grid = document.querySelector('#pricing .price-grid');
    if (!grid || grid.getAttribute('data-sn-enhanced')) return;
    grid.setAttribute('data-sn-enhanced', '1');

    var map = [
      ['79', '119', 'per month'],
      ['197', '299', 'per 3 months'],
      ['657', '997', 'per year']
    ];
    var cards = grid.querySelectorAll('.price-card');
    for (var i = 0; i < cards.length; i++) {
      var m = map[i];
      if (!m) continue;
      var big = cards[i].querySelector('.price-big');
      if (big) {
        big.classList.add('dynamic-price');
        big.setAttribute('data-usd', m[0]);
        big.setAttribute('data-aud', m[1]);
      }
      var sub = cards[i].querySelector('.price-sub');
      if (sub) sub.textContent = m[2];
      var micro = cards[i].querySelector('.price-microcopy');
      if (micro && /\/day/.test(micro.textContent)) {
        micro.innerHTML = 'Less than <span class="dynamic-price" data-usd="2.20/day" data-aud="3.30/day"></span>';
      }
      var cta = cards[i].querySelector('a');
      if (cta) cta.classList.add('dynamic-cta');
    }

    if (!document.querySelector('#pricing .sn-currency-inline')) {
      var api = window.__snoozeCurrencyToggle__;
      if (api && api.createToggleButton) {
        var ph = document.createElement('div');
        ph.className = 'sn-currency-inline';
        var eyebrow = document.createElement('span');
        eyebrow.className = 'sn-currency-inline-label';
        eyebrow.textContent = 'Prices in';
        ph.appendChild(eyebrow);
        ph.appendChild(api.createToggleButton('inline-currency-toggle'));
        grid.parentNode.insertBefore(ph, grid);
      }
    }

    if (window.setCurrency) {
      var current = document.body.classList.contains('currency-mode-aud') ? 'AUD' : 'USD';
      window.setCurrency(current, false);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', enhance);
  } else {
    enhance();
  }
})();
</script>

<script>
  (function () {

    var ENDPOINT = 'https://n8n.khorus.ai/webhook/snooze-checkout-identity';
    var UTM_STORAGE_KEY = 'snooze_utm_attribution';
    var FIRST_TOUCH_KEY = 'snooze_attribution_first_touch';
    var CURRENT_TOUCH_KEY = 'snooze_attribution_current_touch';
    var SENT_PREFIX = 'snooze_identity_sent_';

    function readCookie(name) {
      try {
        var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : null;
      } catch (e) { return null; }
    }

    function allCookies() {
      try { return String(document.cookie || '').split(/;\s*/); } catch (e) { return []; }
    }

    /** "GA1.1.1234567890.1699999999" becomes "1234567890.1699999999". */
    function gaClientId() {
      var raw = readCookie('_ga');
      if (!raw) return null;
      var parts = raw.split('.');
      if (parts.length < 4) return null;
      return parts.slice(-2).join('.');
    }

    /**
     * The session id lives in _ga_<STREAM>. The container routes through the Stape
     * server container with a placeholder measurement id, so the suffix cannot be
     * assumed. Scan for any _ga_ cookie and take the session id segment.
     *
     * The cookie's third dot-separated segment is NOT the session id on its own. The
     * live value measured 2026-08-17 is
     * `_ga_J4TY43FW1G=GS2.1.s1786946916$o1$g1$t1786946942$j34$l0$h1685109018`, so
     * splitting on '.' yields `s1786946916$o1$g1$...` and returning it whole sent GA4
     * a session_id it cannot stitch. Caught on a live order in ME-010: the join
     * succeeded, the client id was right, and the session id was unusable. The digits
     * after the optional leading 's' and before the first '$' are the session id. The
     * regex also handles the older format where the segment is a bare number.
     */
    function gaSessionId() {
      var cookies = allCookies();
      for (var i = 0; i < cookies.length; i++) {
        var pair = cookies[i].split('=');
        if (pair[0] && pair[0].indexOf('_ga_') === 0 && pair[1]) {
          var segs = decodeURIComponent(pair[1]).split('.');
          if (segs.length >= 3) {
            var m = String(segs[2] || '').match(/^s?(\d+)/);
            if (m) return m[1];
          }
        }
      }
      return null;
    }

    function getFbc() {
      var fbc = readCookie('_fbc');
      if (fbc) return fbc;
      try {
        var qs = String(window.location.search || '');
        var m = qs.match(/[?&]fbclid=([^&]*)/);
        if (m && m[1]) return 'fb.1.' + Date.now() + '.' + decodeURIComponent(m[1]);
      } catch (e) {}
      return null;
    }

    function queryParam(name) {
      try {
        var m = String(window.location.search || '').match(new RegExp('[?&]' + name + '=([^&]*)'));
        return m && m[1] ? decodeURIComponent(m[1]) : null;
      } catch (e) { return null; }
    }

    // Three stores, because two different blocks write attribution under two
    // different names and this one originally read only the first. The checkout
    // header block writes snooze_utm_attribution; the site header scripts write
    // snooze_attribution_first_touch and snooze_attribution_current_touch. A
    // visitor who arrives on an ad, browses, and types their email on a later page
    // has no UTM in the URL, so reading the wrong key loses the channel that paid
    // for them. Measured 2026-08-16: the site store held the campaign and this
    // function returned nothing.
    //
    // First touch wins, because that is the click that earned the customer. Fields
    // are merged rather than the whole object taken, so a partial store still
    // contributes what it has.
    function storedAttribution() {
      var merged = {};
      var keys = [UTM_STORAGE_KEY, FIRST_TOUCH_KEY, CURRENT_TOUCH_KEY];
      for (var i = 0; i < keys.length; i++) {
        try {
          var raw = window.localStorage.getItem(keys[i]);
          if (!raw) continue;
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') continue;
          for (var k in parsed) {
            if (Object.prototype.hasOwnProperty.call(parsed, k)
                && merged[k] === undefined && parsed[k] !== null && parsed[k] !== '') {
              merged[k] = parsed[k];
            }
          }
        } catch (e) {}
      }
      return merged;
    }

    function offerToken() {
      try {
        var m = String(window.location.pathname || '').match(/\/offers\/([^/]+)/);
        return m ? m[1] : null;
      } catch (e) { return null; }
    }

    function sha256Hex(input) {
      try {
        var norm = String(input == null ? '' : input).trim().toLowerCase();
        if (!norm) return Promise.resolve(null);
        var bytes = new TextEncoder().encode(norm);
        return crypto.subtle.digest('SHA-256', bytes).then(function (buf) {
          return Array.from(new Uint8Array(buf)).map(function (b) {
            return b.toString(16).padStart(2, '0');
          }).join('');
        });
      } catch (e) {
        return Promise.resolve(null);
      }
    }

    /**
     * Read the buyer's email from the checkout form. The localStorage 'email' key that
     * GTM tag 86 writes is checked as a fallback, because on some checkout templates the
     * scraper reaches the value before a stable selector does.
     */
    function currentEmail() {
      var selectors = [
        'input[type="email"]',
        'input[name="email"]',
        'input[name*="email" i]',
        '#email'
      ];
      for (var i = 0; i < selectors.length; i++) {
        var el = document.querySelector(selectors[i]);
        if (el && el.value && el.value.indexOf('@') > 0) return el.value;
      }
      try {
        var stored = window.localStorage.getItem('email');
        if (stored && stored.indexOf('@') > 0) return stored;
      } catch (e) {}
      return null;
    }

    function looksLikeEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || '').trim());
    }

    function alreadySent(hash) {
      try { return window.sessionStorage.getItem(SENT_PREFIX + hash) === '1'; } catch (e) { return false; }
    }

    function markSent(hash) {
      try { window.sessionStorage.setItem(SENT_PREFIX + hash, '1'); } catch (e) {}
    }

    function send(hash) {
      var attribution = storedAttribution();
      var payload = {
        email_sha256: hash,
        ga_client_id: gaClientId(),
        ga_session_id: gaSessionId(),
        fbp: readCookie('_fbp'),
        fbc: getFbc(),
        gclid: queryParam('gclid') || attribution.gclid || null,
        utm_source: attribution.utm_source || queryParam('utm_source') || null,
        utm_medium: attribution.utm_medium || queryParam('utm_medium') || null,
        utm_campaign: attribution.utm_campaign || queryParam('utm_campaign') || null,
        utm_content: attribution.utm_content || queryParam('utm_content') || null,
        utm_term: attribution.utm_term || queryParam('utm_term') || null,
        offer_token: offerToken(),
        page_location: String(window.location.origin || '') + String(window.location.pathname || ''),
        user_agent: navigator.userAgent
      };

      // No client_ip_address here. n8n reads the source address from the request itself,
      // which is the only trustworthy version of it.
      try {
        fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true,
          mode: 'cors'
        }).catch(function () {});
      } catch (e) {}

      markSent(hash);

      try {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: 'checkout_identity_captured',
          has_ga_client_id: !!payload.ga_client_id,
          has_fbp: !!payload.fbp,
          has_fbc: !!payload.fbc
        });
      } catch (e) {}
    }

    var polls = 0;
    var lastSeen = null;

    function tick() {
      polls += 1;
      var email = currentEmail();
      if (looksLikeEmail(email) && email !== lastSeen) {
        lastSeen = email;
        sha256Hex(email).then(function (hash) {
          if (hash && !alreadySent(hash)) send(hash);
        });
      }
      if (polls < MAX_POLLS) window.setTimeout(tick, POLL_MS);
    }

    // Runs on every page, because the buyer's email is not readable where the order
    // is. Kajabi's hosted checkout collects it inside a Stripe iframe, which is
    // cross-origin: measured 2026-08-16 on two live checkouts, currentEmail() null
    // on both, zero rows captured and zero workflow executions. The email IS
    // readable in the lead forms on the website and landing pages, so that is where
    // this has to run. The order webhook joins on the hash whenever it was captured.
    //
    // The earlier guard started the poll only on a /checkout path, which is why the
    // block was live and inert. The cost of dropping it is 120 querySelector calls
    // spread over two minutes, once per page, and then it stops.
    window.setTimeout(tick, POLL_MS);

    window.SnoozeCheckoutIdentity = { send: send, hash: sha256Hex, currentEmail: currentEmail };
  })();
</script>
