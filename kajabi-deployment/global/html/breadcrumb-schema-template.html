<!--
  BreadcrumbList JSON-LD template for flat Kajabi URLs.

  Replace the PAGE_* and HUB_* placeholders before pasting. Only use this
  when the page also shows the visible line:
  Part of: <a href="HUB_URL">HUB_NAME</a>
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://www.joinsnooze.com/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "HUB_NAME",
      "item": "HUB_URL"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "PAGE_NAME",
      "item": "PAGE_URL"
    }
  ]
}
</script>

<!-- Visible pattern: <p class="snooze-breadcrumb-context">Part of: <a href="HUB_URL">HUB_NAME</a></p> -->
