<script>
  (function () {
    'use strict';

    var STORAGE_KEY = 'snooze_utm_attribution';
    // First-touch-wins window: 30 days. Reasoning: long enough to cover a
    // parent who sees a paid ad, researches for a week or two, then starts a
    // 7-day trial without re-clicking the ad (the considered-purchase case
    // this funnel expects); short enough that a genuinely new visit long
    // after the original click is treated as a fresh journey rather than
    // permanently pinned to a stale campaign. Matches the common GA4/Meta
    // lookback-window order of magnitude rather than inventing a new one.
    var WINDOW_MS = 30 * 24 * 60 * 60 * 1000;
    var UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];

    function ls(key) {
      try { return window.localStorage.getItem(key); } catch (e) { return null; }
    }
    function setLs(key, value) {
      try { window.localStorage.setItem(key, value); } catch (e) {}
    }

    function readStored() {
      var raw = ls(STORAGE_KEY);
      if (!raw) return null;
      try {
        var parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function isStale(stored) {
      if (!stored || !stored.captured_at) return true;
      var capturedAt = Date.parse(stored.captured_at);
      if (!isFinite(capturedAt)) return true;
      return (Date.now() - capturedAt) > WINDOW_MS;
    }

    function captureFromUrl() {
      var params;
      try {
        params = new URLSearchParams(window.location.search);
      } catch (e) {
        return;
      }

      var incoming = {};
      var hasAny = false;
      UTM_KEYS.forEach(function (key) {
        // utm_content (and every other key here) is read and stored verbatim,
        // no trim, no case change, no truncation: it carries ad_name
        // character for character and any normalisation breaks the
        // utm_content == ad_name attribution join.
        var value = params.get(key);
        if (value !== null && value !== '') {
          incoming[key] = value;
          hasAny = true;
        }
      });
      var fbclid = params.get('fbclid');
      if (fbclid) {
        incoming.fbclid = fbclid;
        hasAny = true;
      }

      if (!hasAny) return;

      var stored = readStored();
      // First touch wins within the window: only overwrite when there is
      // nothing stored yet, or what is stored has aged past WINDOW_MS. A
      // later organic visit never carries UTM params at all, so it can never
      // reach this branch and never overwrites a paid first touch.
      if (stored && !isStale(stored)) return;

      incoming.captured_at = new Date().toISOString();
      setLs(STORAGE_KEY, JSON.stringify(incoming));
    }

    function pushToDataLayer() {
      var stored = readStored();
      if (!stored) return;

      var payload = { event: 'utm_attribution_present' };
      var hasAny = false;
      UTM_KEYS.concat(['fbclid']).forEach(function (key) {
        if (stored[key]) {
          payload[key] = stored[key];
          hasAny = true;
        }
      });
      if (!hasAny) return;

      try {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push(payload);
      } catch (e) {}
    }

    captureFromUrl();
    pushToDataLayer();
  })();
</script>

<script>
  (function () {
    'use strict';

    var ENDPOINT = 'https://n8n.khorus.ai/webhook/snooze-checkout-identity';
    var UTM_STORAGE_KEY = 'snooze_utm_attribution';
    var SENT_PREFIX = 'snooze_identity_sent_';
    var POLL_MS = 1000;
    var MAX_POLLS = 120;

    function readCookie(name) {
      try {
        var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : null;
      } catch (e) { return null; }
    }

    function allCookies() {
      try { return String(document.cookie || '').split(/;\s*/); } catch (e) { return []; }
    }

    /** "GA1.1.1234567890.1699999999" becomes "1234567890.1699999999". */
    function gaClientId() {
      var raw = readCookie('_ga');
      if (!raw) return null;
      var parts = raw.split('.');
      if (parts.length < 4) return null;
      return parts.slice(-2).join('.');
    }

    /**
     * The session id lives in _ga_<STREAM>. The container routes through the Stape
     * server container with a placeholder measurement id, so the suffix cannot be
     * assumed. Scan for any _ga_ cookie and take the session id segment.
     */
    function gaSessionId() {
      var cookies = allCookies();
      for (var i = 0; i < cookies.length; i++) {
        var pair = cookies[i].split('=');
        if (pair[0] && pair[0].indexOf('_ga_') === 0 && pair[1]) {
          var segs = decodeURIComponent(pair[1]).split('.');
          if (segs.length >= 3) return segs[2];
        }
      }
      return null;
    }

    function getFbc() {
      var fbc = readCookie('_fbc');
      if (fbc) return fbc;
      try {
        var qs = String(window.location.search || '');
        var m = qs.match(/[?&]fbclid=([^&]*)/);
        if (m && m[1]) return 'fb.1.' + Date.now() + '.' + decodeURIComponent(m[1]);
      } catch (e) {}
      return null;
    }

    function queryParam(name) {
      try {
        var m = String(window.location.search || '').match(new RegExp('[?&]' + name + '=([^&]*)'));
        return m && m[1] ? decodeURIComponent(m[1]) : null;
      } catch (e) { return null; }
    }

    function storedAttribution() {
      try {
        var raw = window.localStorage.getItem(UTM_STORAGE_KEY);
        if (!raw) return {};
        var parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch (e) { return {}; }
    }

    function offerToken() {
      try {
        var m = String(window.location.pathname || '').match(/\/offers\/([^/]+)/);
        return m ? m[1] : null;
      } catch (e) { return null; }
    }

    function sha256Hex(input) {
      try {
        var norm = String(input == null ? '' : input).trim().toLowerCase();
        if (!norm) return Promise.resolve(null);
        var bytes = new TextEncoder().encode(norm);
        return crypto.subtle.digest('SHA-256', bytes).then(function (buf) {
          return Array.from(new Uint8Array(buf)).map(function (b) {
            return b.toString(16).padStart(2, '0');
          }).join('');
        });
      } catch (e) {
        return Promise.resolve(null);
      }
    }

    /**
     * Read the buyer's email from the checkout form. The localStorage 'email' key that
     * GTM tag 86 writes is checked as a fallback, because on some checkout templates the
     * scraper reaches the value before a stable selector does.
     */
    function currentEmail() {
      var selectors = [
        'input[type="email"]',
        'input[name="email"]',
        'input[name*="email" i]',
        '#email'
      ];

        var el = document.querySelector(selectors[i]);
        if (el && el.value && el.value.indexOf('@') > 0) return el.value;
      }
      try {
        var stored = window.localStorage.getItem('email');
        if (stored && stored.indexOf('@') > 0) return stored;
      } catch (e) {}
      return null;
    }

      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || '').trim());
    }

      try { return window.sessionStorage.getItem(SENT_PREFIX + hash) === '1'; } catch (e) { return false; }
    }

      try { window.sessionStorage.setItem(SENT_PREFIX + hash, '1'); } catch (e) {}
    }

      var attribution = storedAttribution();
      var payload = {
        email_sha256: hash,
        ga_client_id: gaClientId(),
        ga_session_id: gaSessionId(),
        fbp: readCookie('_fbp'),
        fbc: getFbc(),
        gclid: queryParam('gclid') || attribution.gclid || null,
        utm_source: attribution.utm_source || queryParam('utm_source') || null,
        utm_medium: attribution.utm_medium || queryParam('utm_medium') || null,
        utm_campaign: attribution.utm_campaign || queryParam('utm_campaign') || null,
        utm_content: attribution.utm_content || queryParam('utm_content') || null,

          headers: { 'Content-Type': 'application/json' },

      try {

          has_fbp: !!payload.fbp,
          has_fbc: !!payload.fbc
        });
      } catch (e) {}
    }

    var lastSeen = null;

    // dead weight, so it does not start.
    if (String(window.location.pathname || '').indexOf('/checkout') > -1) {
      window.setTimeout(tick, POLL_MS);
    }

    window.SnoozeCheckoutIdentity = { send: send, hash: sha256Hex, currentEmail: currentEmail };
  })();
</script>
