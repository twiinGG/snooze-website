<script>
(function waitForOffer() {
  var priceEl = document.querySelector("#offer-price");
  var titleEl = document.querySelector("#offer-title");

  if (priceEl && titleEl) {
    var value = parseFloat(priceEl.innerText.replace(/[^\d.]/g, ''));
    var product_name = titleEl.innerText;

    // AUD offer detection - keep this list in sync with AUD_OFFER_SLUGS in
    // apps/snooze-website/kajabi-deployment/global/js/kajabi-checkout-tracking.js
    // and with the 0.3 Purchase - DataLayer tag. USD is the default for any
    // offer not on this list.
    var AUD_OFFER_SLUGS = [
      'vYgCNgJz', 'Sr6KzShx', '46Bz9tk6', 'ENhg45mj', 'FkZfbT25', '8SL8r5sC',
      'azdqxZuK', 'JfeoXoKn', 'xGVQ2zfC', 'wgqokagt', 'd5HsPDpJ', 'ZYWF7eY8'
    ];
    var offerToken = (window.CLIENT_INFO && window.CLIENT_INFO.offer_token) || '';
    var isAudOffer = false;
    for (var i = 0; i < AUD_OFFER_SLUGS.length; i++) {
      if (offerToken === AUD_OFFER_SLUGS[i] || window.location.pathname.indexOf(AUD_OFFER_SLUGS[i]) > -1) {
        isAudOffer = true;
        break;
      }
    }
    var currency = isAudOffer ? 'AUD' : 'USD';

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: "begin_checkout",
      ecommerce: {
        currency: currency,
        value: value,
        items: [
          {
            item_name: product_name,
            price: value,
            quantity: 1
          }
        ]
      }
    });
    console.log("✅ begin_checkout pushed (Kajabi loaded), currency=" + currency);
  } else {
    setTimeout(waitForOffer, 400);
  }
})();
</script>
