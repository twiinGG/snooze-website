<!-- ============================================
     SNOOZE CURRENCY TOGGLE - FOUC PREVENTION
     Add this to: Kajabi Website theme > Custom Javascript (before currency-toggle.js),
     or Header Page Scripts if not using the website theme slot.
     ============================================ -->

<style>
/* FOUC Prevention: Hide prices until JS determines currency */
.dynamic-price, .dynamic-cta {
  visibility: hidden; 
  opacity: 0;
  transition: opacity 0.2s ease;
}

body.currency-loaded .dynamic-price,
body.currency-loaded .dynamic-cta {
  visibility: visible;
  opacity: 1;
}
</style>

<script>
/**
 * SNOOZE CURRENCY TOGGLE - FOUC PREVENTION
 * Runs immediately in <head> before DOM ready
 * Prevents flash of wrong currency on page load
 */
(function() {
  'use strict';
  
  try {
    // Check localStorage for currency preference
    var currency = localStorage.getItem('snooze_currency_preference');
    
    // Auto-detect if no preference saved
    if (!currency) {
      try {
        var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        currency = (tz && tz.includes('Australia')) ? 'AUD' : 'USD';
      } catch (e) {
        currency = 'USD';
      }
    }
    
    // Add class to document element immediately (before body exists)
    if (currency === 'AUD') {
      document.documentElement.classList.add('currency-aud-selected');
    }
    
    // Mark as loaded (will be applied to body when it exists)
    document.documentElement.classList.add('currency-loaded');
    
  } catch (e) {
    // If localStorage unavailable (Safari private mode), default to USD
    document.documentElement.classList.add('currency-loaded');
  }
})();
</script>
