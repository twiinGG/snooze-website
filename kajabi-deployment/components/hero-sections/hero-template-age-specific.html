<!-- ============================================
     HERO SECTION TEMPLATE - AGE-SPECIFIC
     Template for age-specific pages (newborn, 3-4-month, 5-12-month, toddler)
     ============================================ -->

<section class="snooze-hero-age-specific" id="snooze-hero-{AGE}">
  <div class="sh-container">
    <div class="sh-layout">
      <div class="sh-content">
        <h1 class="sh-headline">{HEADLINE}</h1>
        <p class="sh-subheadline">{SUBHEADLINE}</p>
        
        <ul class="sh-supporting-points">
          <li class="sh-point">{POINT_1}</li>
          <li class="sh-point">{POINT_2}</li>
          <li class="sh-point">{POINT_3}</li>
        </ul>

        <!-- Context-Aware CTA -->
        <div id="hero-cta-location" class="sh-cta-container"></div>
        <script>
        (function() {
          if (typeof window.SNOOZE_CHECKOUT_URL === 'undefined') {
            window.SNOOZE_CHECKOUT_URL = 'https://www.joinsnooze.com/offers/6iRarwak/checkout';
          }
          if (typeof window.SNOOZE_LIBRARY_URL === 'undefined') {
            window.SNOOZE_LIBRARY_URL = '/snooze-library';
          }
          var userStatus = 'signposting';
          if (typeof window.SnoozeUserDetection !== 'undefined') {
            userStatus = window.SnoozeUserDetection.getUserStatus();
          }
          var heroCta = document.getElementById('hero-cta-location');
          if (heroCta) {
            var ctaHTML = '';
            if (userStatus === 'snooze-member') {
              ctaHTML = '<a href="' + window.SNOOZE_LIBRARY_URL + '" class="snooze-btn-primary">Go to Library</a>';
            } else if (userStatus === 'logged-in-non-member') {
              ctaHTML = '<a href="' + window.SNOOZE_CHECKOUT_URL + '" class="snooze-btn-primary">Upgrade to Snooze</a>';
            } else {
              ctaHTML = '<a href="' + window.SNOOZE_CHECKOUT_URL + '" class="snooze-btn-primary">Join Snooze</a>';
            }
            heroCta.innerHTML = ctaHTML;
          }
        })();
        </script>
        
        <div class="sh-trust-signal">
          <p class="sh-trust-text">
            <strong>Trusted by thousands of families.</strong> Evidence-based guidance from a paediatric nurse and certified sleep consultant who's helped over 10,000 families get better sleep.
          </p>
        </div>
      </div>
      
      <div class="sh-image">
        <img src="{IMAGE_URL}" alt="{IMAGE_ALT}" loading="eager">
      </div>
    </div>
  </div>
</section>
