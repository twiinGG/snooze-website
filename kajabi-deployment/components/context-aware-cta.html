<!-- ============================================
     CONTEXT-AWARE CTA COMPONENT
     Shows appropriate CTA based on user status
     Falls back to signposting if detection fails
     ============================================ -->

<div class="snooze-context-cta" id="snooze-context-cta">
  <!-- This will be populated by JavaScript -->
  <div class="snooze-cta-loading">Loading...</div>
</div>

<script>
(function() {
  // Ensure globals are loaded
  if (typeof window.SNOOZE_CHECKOUT_URL === 'undefined') {
    window.SNOOZE_CHECKOUT_URL = 'https://joinsnooze.com/offers/z63s9VaR/checkout';
  }
  if (typeof window.SNOOZE_LIBRARY_URL === 'undefined') {
    window.SNOOZE_LIBRARY_URL = '/snooze-library';
  }
  
  // Get user status (with fallback to signposting)
  var userStatus = 'signposting'; // Default to signposting (safest approach)
  
  // Try detection if available
  if (typeof window.SnoozeUserDetection !== 'undefined') {
    userStatus = window.SnoozeUserDetection.getUserStatus();
  }
  
  // Get CTA container
  var ctaContainer = document.getElementById('snooze-context-cta');
  if (!ctaContainer) return;
  
  // Generate appropriate CTA based on status
  var ctaHTML = '';
  
  if (userStatus === 'snooze-member') {
    // Snooze Member: Show Library access
    ctaHTML = `
      <div class="snooze-cta-member">
        <a href="${window.SNOOZE_LIBRARY_URL}" class="snooze-btn-primary">
          Go to Library
        </a>
        <p class="snooze-cta-note">Access all your Snooze resources</p>
      </div>
    `;
  } else if (userStatus === 'logged-in-non-member') {
    // Logged-in Non-Member: Show upgrade CTA
    ctaHTML = `
      <div class="snooze-cta-upgrade">
        <a href="${window.SNOOZE_CHECKOUT_URL}" class="snooze-btn-primary">
          Upgrade to Snooze
        </a>
        <p class="snooze-cta-note">Unlock full access to Library, Village, and Coaching</p>
      </div>
    `;
  } else if (userStatus === 'new-visitor') {
    // New Visitor: Show join CTA
    ctaHTML = `
      <div class="snooze-cta-join">
        <a href="${window.SNOOZE_CHECKOUT_URL}" class="snooze-btn-primary">
          Join Snooze
        </a>
        <p class="snooze-cta-note">Get access to all sleep resources and support</p>
      </div>
    `;
  } else {
    // Signposting: Show all options with clear labels
    ctaHTML = `
      <div class="snooze-cta-signposting">
        <div class="snooze-cta-options">
          <div class="snooze-cta-option">
            <a href="${window.SNOOZE_CHECKOUT_URL}" class="snooze-btn-primary">
              Join Snooze
            </a>
            <p class="snooze-cta-label">New to Snooze? Start here</p>
          </div>
          <div class="snooze-cta-divider">or</div>
          <div class="snooze-cta-option">
            <a href="${window.SNOOZE_LIBRARY_URL}" class="snooze-btn-secondary">
              Go to Library
            </a>
            <p class="snooze-cta-label">Already a member? Access your resources</p>
          </div>
        </div>
        <p class="snooze-cta-help">Not sure? <a href="${window.SNOOZE_LOGIN_URL || '/login'}">Log in</a> to check your access</p>
      </div>
    `;
  }
  
  // Insert CTA HTML
  ctaContainer.innerHTML = ctaHTML;
})();
</script>

<style>
/* Context-Aware CTA Styles */
.snooze-context-cta {
  margin: 2rem 0;
  text-align: center;
}

.snooze-cta-loading {
  color: #666;
  font-size: 0.9rem;
}

.snooze-btn-primary {
  display: inline-block;
  padding: 1rem 2rem;
  background-color: #f43357;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-weight: 600;
  font-size: 1.1rem;
  transition: background-color 0.2s;
}

.snooze-btn-primary:hover {
  background-color: #d12a4a;
  color: white;
}

.snooze-btn-secondary {
  display: inline-block;
  padding: 0.875rem 1.75rem;
  background-color: transparent;
  color: #f43357;
  text-decoration: none;
  border: 2px solid #f43357;
  border-radius: 6px;
  font-weight: 600;
  font-size: 1.1rem;
  transition: all 0.2s;
}

.snooze-btn-secondary:hover {
  background-color: #f43357;
  color: white;
}

.snooze-cta-note {
  margin-top: 0.75rem;
  color: #666;
  font-size: 0.95rem;
}

/* Signposting Styles */
.snooze-cta-signposting {
  max-width: 500px;
  margin: 0 auto;
}

.snooze-cta-options {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.snooze-cta-option {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.snooze-cta-label {
  margin-top: 0.5rem;
  font-size: 0.85rem;
  color: #666;
}

.snooze-cta-divider {
  color: #999;
  font-size: 0.9rem;
  margin: 0.25rem 0;
}

.snooze-cta-help {
  margin-top: 1rem;
  font-size: 0.9rem;
  color: #666;
}

.snooze-cta-help a {
  color: #f43357;
  text-decoration: underline;
}

/* Mobile Responsive */
@media (max-width: 768px) {
  .snooze-btn-primary,
  .snooze-btn-secondary {
    width: 100%;
    text-align: center;
  }
  
  .snooze-cta-options {
    gap: 1.5rem;
  }

</style>
