<style>
#camp-inquiry-inline{margin:20px auto 0;max-width:580px;padding:0 12px;color:#295640;font-family:inherit;font-size:16px;line-height:1.5;text-align:center}
#camp-inquiry-inline h2{margin:0 0 10px;color:#295640;font-family:inherit;font-size:22px;line-height:1.2}
#camp-inquiry-inline p{margin:0 0 10px}
#camp-inquiry-inline .ci-chat{display:inline-block;padding:10px 18px;border:1px solid #295640;border-radius:9px;color:#fffdf7;background:#295640;font-weight:600;text-decoration:none;min-height:44px;box-sizing:border-box}
#camp-inquiry-inline .ci-email{display:block;margin:12px 0;color:#295640;text-decoration:underline}
#camp-inquiry-inline .ci-status{font-size:14px;color:#546458}
#camp-inquiry-inline a:focus-visible{outline:3px solid #c68b27;outline-offset:4px}
</style>
<section id="camp-inquiry-inline" aria-labelledby="camp-inquiry-title">
  <h2 id="camp-inquiry-title">Chat with us</h2>
  <p>Questions about Camp or choosing sleep support? Send us a message. Leave your email so we can follow up ASAP if we're unavailable.</p>
  <a class="ci-chat" href="mailto:camp@joinsnooze.com?subject=Question%20about%20Camp%20Snooze" data-camp-inquiry="native_chat" data-camp-inquiry-placement="under_video" aria-describedby="camp-inquiry-status">Message us</a>
  <a class="ci-email" href="mailto:camp@joinsnooze.com?subject=Question%20about%20Camp%20Snooze" data-camp-inquiry="email" data-camp-inquiry-placement="under_video">Prefer email? Write to the Camp team</a>
  <p id="camp-inquiry-status" class="ci-status" role="status" aria-live="polite">If chat is unavailable, email the Camp team.</p>
</section>
<script>
(function () {
  'use strict';
  var inline = document.getElementById('camp-inquiry-inline');
  if (!inline || inline.dataset.ready) return;
  inline.dataset.ready = 'true';
  var status = document.getElementById('camp-inquiry-status');
  var videoSection = document.querySelector('.camp-main-vsl');
  if (videoSection) videoSection.appendChild(inline);

  function updateStatus() {
    var chat = window.SnoozeChat;
    status.textContent = chat && chat.state === 'ready' ? '' :
      chat && chat.state === 'loading' ? 'Chat is loading. You can email the Camp team below.' :
        'Chat is unavailable. Please email the Camp team below.';
  }
  document.addEventListener('snooze:chat-state', updateStatus);
  inline.querySelectorAll('[data-camp-inquiry]').forEach(function (link) {
    link.addEventListener('click', function (event) {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'camp_inquiry_click', inquiry_channel: link.dataset.campInquiry,
        inquiry_placement: link.dataset.campInquiryPlacement });
      // The href remains a working email route without JS, on blocked surfaces
      // or if the loader fails. Only consume a click accepted by the chat API.
      if (link.dataset.campInquiry === 'native_chat' && window.SnoozeChat && window.SnoozeChat.open()) {
        event.preventDefault();
        updateStatus();
      }
    });
  });
}());
</script>
