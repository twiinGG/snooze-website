<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Membership backend-only visual harness</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #faf7f4; color: #1f293b; font-family: Poppins, -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; }
    .fixture-header { align-items: center; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; min-height: 72px; padding: 16px clamp(20px, 5vw, 72px); }
    .fixture-brand { font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; font-weight: 700; }
    .fixture-secure { color: #4b5563; font-size: .875rem; }
    .fixture-checkout { display: grid; gap: 48px; grid-template-columns: minmax(0, 1fr) minmax(360px, .82fr); margin: 0 auto; max-width: 1120px; padding: 56px 24px 72px; }
    .fixture-content, .fixture-payment { min-width: 0; }
    .fixture-payment { align-self: start; background: #fff; border-radius: 12px; box-shadow: 0 4px 8px rgba(0, 0, 0, .05); padding: 28px; }
    .fixture-payment h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; margin: 0 0 20px; }
    .fixture-options { display: grid; gap: 12px; }
    .embedded-checkout-pricing-option { align-items: center; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; display: flex; justify-content: space-between; min-height: 64px; padding: 14px 16px; }
    .embedded-checkout-pricing-option.selected { border-color: #d62646; box-shadow: 0 0 0 1px #d62646; }
    .fixture-option-name { font-weight: 600; }
    .fixture-option-price { color: #4b5563; }
    .fixture-field { border: 1px solid #cbd5e1; border-radius: 8px; color: #64748b; margin-top: 12px; min-height: 48px; padding: 13px 14px; }
    .fixture-submit { background: #d62646; border: 0; border-radius: 9999px; color: #fff; font: inherit; font-weight: 700; margin-top: 18px; min-height: 52px; width: 100%; }
    @media (max-width: 768px) {
      .fixture-header { min-height: 60px; padding: 12px 18px; }
      .fixture-brand { font-size: 1.25rem; }
      .fixture-checkout { display: flex; flex-direction: column; gap: 28px; padding: 28px 18px 48px; }
      .fixture-payment { padding: 20px; }
    }
  </style>
</head>
<body>
  <header class="fixture-header"><div class="fixture-brand">Snooze</div><div class="fixture-secure">Secure checkout</div></header>
  <main class="fixture-checkout">
    <section class="fixture-content" data-content-slot></section>
    <form class="fixture-payment" aria-label="Checkout form">
      <h2>Choose your membership plan</h2>
      <div class="fixture-options">
        <div class="embedded-checkout-pricing-option selected" data-variant-id="160544" aria-checked="true"><span class="fixture-option-name">Monthly</span><span class="fixture-option-price">$79 monthly</span></div>
        <div class="embedded-checkout-pricing-option" data-variant-id="64815" aria-checked="false"><span class="fixture-option-name">Quarterly</span><span class="fixture-option-price">$198 every 3 months</span></div>
        <div class="embedded-checkout-pricing-option" data-variant-id="64816" aria-checked="false"><span class="fixture-option-name">Annual</span><span class="fixture-option-price">$660 yearly</span></div>
      </div>
      <div class="fixture-field">Email address</div><div class="fixture-field">Card details</div>
      <button class="fixture-submit" type="button">Start free trial</button>
    </form>
  </main>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode') === 'baseline' ? 'baseline' : 'candidate';
      const currency = params.get('currency') === 'AUD' ? 'AUD' : 'USD';
      const root = '/apps/snooze-website/kajabi-deployment/';
      const checkout = root + 'pages/checkout/7-day-trial-membership/';
      const preimages = root + '_live-preimages/membership-trial-checkouts/';
      const files = mode === 'baseline'
        ? {
            css: preimages + '2026-08-30-theme-2164307125-usd-trial-checkout-css-pre.css',
            html: preimages + (currency === 'AUD' ? '2026-08-30-theme-2166681818-aud-trial-checkout-html-pre.html' : '2026-08-30-theme-2164307125-usd-trial-checkout-html-pre.html'),
            js: preimages + '2026-08-30-theme-2164307125-usd-trial-checkout-js-pre.js'
          }
        : {
            css: checkout + 'shared/checkout.css',
            html: checkout + (currency === 'AUD' ? 'aud/checkout-blocks.html' : 'usd/checkout-blocks.html'),
            js: checkout + 'shared/checkout.js'
          };
      const responses = await Promise.all([fetch(files.css), fetch(files.html), fetch(files.js)]);
      const payloads = await Promise.all(responses.map(function(response) {
        if (!response.ok) throw new Error('fixture fetch failed: ' + response.url + ' ' + response.status);
        return response.text();
      }));
      const style = document.createElement('style');
      style.textContent = payloads[0];
      document.head.appendChild(style);
      document.querySelector('[data-content-slot]').innerHTML = payloads[1];
      if (currency === 'AUD') {
        document.querySelectorAll('[data-variant-id]').forEach(function(option, index) { option.setAttribute('data-variant-id', ['160790', '160791', '160792'][index]); });
        document.querySelectorAll('.fixture-option-price').forEach(function(price, index) { price.textContent = ['A$119 monthly', 'A$297 every 3 months', 'A$996 yearly'][index]; });
      }
      window.dataLayer = [];
      const script = document.createElement('script');
      script.textContent = payloads[2];
      document.body.appendChild(script);
      document.documentElement.setAttribute('data-fixture-ready', 'true');
    })().catch(function(error) {
      document.documentElement.setAttribute('data-fixture-error', error.message);
      throw error;
    });
  </script>
</body>
</html>
